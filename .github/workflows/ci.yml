name: Desktop app checks
on:
  push:
    branches: [master]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit
      # Electron launcher tests require a graphical session and a working SUID sandbox.
      - run: sudo chown root:root node_modules/electron/dist/chrome-sandbox && sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run -a npm test
      - run: npm run build
      # PS-08 release gate: all desktop smoke journeys, not just position search.
      - run: xvfb-run -a npm run test:desktop
      # Isolated deterministic fixture only; emits reproducible machine-readable measurements.
      - run: npm run benchmark:positions -- --games 240 --samples 80
